<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CST LAN Challenge – Ghost AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{--bg:#14170f;--ink:#ecebdc;--mute:#9a9f86;--flare:#ff6a1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 20px 6px}
h1{margin:0;font-size:2.3rem;line-height:1}
header p{margin:6px 0 0;color:var(--mute);font-size:1.1rem}
#viewer-container{position:relative;flex:1;min-height:0;width:100%;display:flex}
model-viewer{flex:1;min-height:0;width:100%;background:radial-gradient(circle at 50% 55%,#2d3521,#14170f 72%);--poster-color:transparent}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(20,23,15,.82);z-index:4}
#loader.hidden{display:none}
.bar-wrap{width:min(260px,78%);height:8px;background:#262c1c;border:1px solid #3a4128;border-radius:4px;overflow:hidden}
#bar{height:100%;width:0%;background:var(--flare);transition:width .15s linear}
#load-text{font-size:1.15rem;color:var(--ink);max-width:340px}
#retry{display:none;padding:10px 22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.15rem;font-weight:700;border-radius:4px;cursor:pointer}
#ar{position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer;border-radius:4px;z-index:3}
#ar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#xr{display:none;position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer;border-radius:4px;z-index:5}
#xr:disabled{opacity:.6;cursor:default}
#xr:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#note{margin:0;padding:8px 20px;color:var(--mute);text-align:center;min-height:2.4em;font-size:1.05rem}
#overlay{display:none;position:fixed;inset:0;pointer-events:none}
#status{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;text-align:center;background:rgba(20,23,15,.85);color:var(--ink);padding:10px 16px;font-size:1.2rem;border-radius:4px}
#exit{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;padding:12px 28px;font:inherit;font-size:1.2rem;background:rgba(20,23,15,.9);color:var(--ink);border:1px solid #3a4128;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>CST LAN Challenge</h1>
  <p>Tap Open AR camera, point at the table, and walk around Ghost.</p>
</header>
<div id="viewer-container">
  <div id="loader">
    <div id="load-text">Loading Ghost Salute…</div>
    <div class="bar-wrap"><div id="bar"></div></div>
    <button id="retry">Retry</button>
  </div>
  <model-viewer id="mv" alt="Ghost Salute AR" autoplay
    camera-controls camera-orbit="0deg 75deg 0.75m" shadow-intensity="1" interaction-prompt="none"
    ar ar-modes="quick-look scene-viewer webxr" ar-placement="floor" ar-scale="fixed" loading="eager">
    <button slot="ar-button" id="ar">Open AR camera</button>
  </model-viewer>
  <button id="xr" disabled>Loading Ghost…</button>
</div>
<div id="overlay">
  <div id="status"></div>
  <button id="exit">Close</button>
</div>
<p id="note">Loading model from S3. Allow camera access when opening AR.</p>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const MODEL_URL = 'https://cst-lan.s3.eu-north-1.amazonaws.com/Gost+Salute.fbx';
const IOS_USDZ_URL = '';       // Optional: paste an S3 .usdz URL here if you also upload a pre-baked animated USDZ for iOS
const TARGET_HEIGHT = 0.25;    // 25 cm tabletop height (set to 1.8 for life-size)

const $ = id => document.getElementById(id);
const mv = $('mv'), xrBtn = $('xr'), note = $('note');
const loaderEl = $('loader'), loadText = $('load-text'), bar = $('bar'), retryBtn = $('retry');

mv.addEventListener('load', () => {
  if (!hasWebXR && !mv.canActivateAR) {
    note.textContent = 'AR is not supported on this phone or browser. On iPhone use Safari; on Android use Chrome.';
  }
});

// Detect Android WebXR ARCore support (iPhone Safari automatically uses <model-viewer> Apple AR Quick Look)
const hasWebXR = !!(navigator.xr && await Promise.race([
  navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
  new Promise(r => setTimeout(() => r(false), 2000))
]));

if (hasWebXR) {
  mv.removeAttribute('ar');
  xrBtn.style.display = 'block';
  xrBtn.disabled = true;
  xrBtn.textContent = 'Loading Ghost…';
  note.textContent = 'Tap Open AR camera, scan the table, and walk around Ghost.';
} else {
  note.textContent = 'Tap Open AR camera. Scan the table to lock Ghost in place, then walk around him.';
}

// Convert FBX MeshPhong/Lambert materials to PBR MeshStandardMaterial (required for clean GLB/USDZ export)
function toStandardMaterial(m) {
  if (!m) return new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.75 });
  if (m.isMeshStandardMaterial) {
    if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
    return m;
  }
  const std = new THREE.MeshStandardMaterial({
    name: m.name || '',
    color: m.color ? m.color.clone() : new THREE.Color(0xffffff),
    map: m.map || null,
    normalMap: m.normalMap || null,
    bumpMap: m.bumpMap || null,
    emissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
    emissiveMap: m.emissiveMap || null,
    roughness: 0.72,
    metalness: 0.12,
    transparent: !!(m.transparent && m.opacity < 0.99),
    opacity: m.opacity === 0 ? 1 : (m.opacity ?? 1),
    alphaTest: m.alphaTest || 0,
    side: m.side ?? THREE.FrontSide
  });
  if (std.map) std.map.colorSpace = THREE.SRGBColorSpace;
  if (std.emissiveMap) std.emissiveMap.colorSpace = THREE.SRGBColorSpace;
  return std;
}

// Wait for embedded FBX blob-URL textures to decode before exporting to GLB
async function waitForAndCleanTextures(root) {
  const promises = [];
  const seen = new Set();
  const texKeys = ['map', 'normalMap', 'bumpMap', 'emissiveMap', 'roughnessMap', 'metalnessMap'];

  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      texKeys.forEach(key => {
        const tex = m[key];
        const img = tex && tex.image;
        if (!img || seen.has(img)) return;
        seen.add(img);
        if (img instanceof HTMLImageElement && (!img.complete || img.naturalWidth === 0)) {
          promises.push(new Promise(res => {
            const done = () => res();
            img.addEventListener('load', done, { once: true });
            img.addEventListener('error', done, { once: true });
            setTimeout(done, 5000);
          }));
        }
      });
    });
  });

  if (promises.length) await Promise.all(promises);

  // Strip any unreadable/empty textures so GLTFExporter never fails on drawImage()
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      texKeys.forEach(key => {
        const tex = m[key];
        if (!tex) return;
        const img = tex.image;
        const okImg = img && (
          (img instanceof HTMLImageElement && img.complete && img.naturalWidth > 0) ||
          (typeof ImageBitmap !== 'undefined' && img instanceof ImageBitmap) ||
          (img instanceof HTMLCanvasElement && img.width > 0) ||
          (img.width > 0 && img.height > 0 && img.data)
        );
        if (!okImg) {
          m[key] = null;
          m.needsUpdate = true;
        }
      });
    });
  });
}

// Compute exact world-space bounding box of an animated SkinnedMesh so boots touch y = 0
function computeExactSkinnedBox(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  const v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    const pos = o.geometry.attributes.position;
    if (!pos || pos.count === 0) return;
    if (o.isSkinnedMesh && o.skeleton) {
      try { o.skeleton.update(); } catch (_) {}
    }
    const step = Math.max(1, Math.floor(pos.count / 4000));
    for (let i = 0; i < pos.count; i += step) {
      try {
        if (o.isSkinnedMesh && typeof o.getVertexPosition === 'function') {
          o.getVertexPosition(i, v);
        } else {
          v.fromBufferAttribute(pos, i);
        }
      } catch (_) {
        v.fromBufferAttribute(pos, i);
      }
      v.applyMatrix4(o.matrixWorld);
      if (isFinite(v.x) && isFinite(v.y) && isFinite(v.z)) box.expandByPoint(v);
    }
  });
  return box;
}

// Fetch FBX as ArrayBuffer with progress, then parse directly with FBXLoader.parse()
async function fetchArrayBufferWithProgress(url, onProgress) {
  const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
  if (!res.ok) throw new Error(`HTTP ${res.status} fetching model`);
  const total = Number(res.headers.get('content-length')) || 0;
  if (!res.body) return await res.arrayBuffer();

  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.byteLength;
    onProgress(loaded, total);
  }
  const out = new Uint8Array(loaded);
  let offset = 0;
  for (const c of chunks) { out.set(c, offset); offset += c.byteLength; }
  return out.buffer;
}

let ghostGroup = null;
let ghostAnims = [];
let glbBlobUrl = null;

async function loadFBXModel() {
  loaderEl.classList.remove('hidden');
  retryBtn.style.display = 'none';
  bar.style.width = '5%';
  loadText.textContent = 'Downloading Ghost Salute…';
  if (hasWebXR) { xrBtn.disabled = true; xrBtn.textContent = 'Loading Ghost…'; }

  try {
    const buffer = await fetchArrayBufferWithProgress(MODEL_URL, (loaded, total) => {
      if (total > 0) {
        const pct = Math.min(88, Math.round((loaded / total) * 88));
        bar.style.width = pct + '%';
        loadText.textContent = `Downloading Ghost Salute… ${pct}% (${(loaded / 1048576).toFixed(1)} MB)`;
      } else {
        bar.style.width = '45%';
        loadText.textContent = `Downloading Ghost Salute… ${(loaded / 1048576).toFixed(1)} MB`;
      }
    });

    loadText.textContent = 'Parsing 3D model…';
    bar.style.width = '90%';
    await new Promise(r => setTimeout(r, 20)); // allow UI repaint

    const fbxLoader = new FBXLoader();
    const basePath = MODEL_URL.substring(0, MODEL_URL.lastIndexOf('/') + 1);
    const fbx = fbxLoader.parse(buffer, basePath);

    // Upgrade materials to PBR and prevent skinned mesh frustum culling
    fbx.traverse(o => {
      if (!o.isMesh) return;
      o.frustumCulled = false;
      o.material = Array.isArray(o.material)
        ? o.material.map(toStandardMaterial)
        : toStandardMaterial(o.material);
    });

    await waitForAndCleanTextures(fbx);

    // Pose on first animation frame so exact feet height is measured accurately
    ghostAnims = fbx.animations || [];
    if (ghostAnims.length > 0) {
      const tmpMixer = new THREE.AnimationMixer(fbx);
      const clip = ghostAnims.find(a => /salute|mixamo/i.test(a.name)) || ghostAnims[0];
      tmpMixer.clipAction(clip).play();
      tmpMixer.update(0.05);
    }

    // Wrap in root group, scale to TARGET_HEIGHT (25 cm), center X/Z and place boots flush at y = 0
    ghostGroup = new THREE.Group();
    ghostGroup.add(fbx);

    const box1 = computeExactSkinnedBox(fbx);
    const rawH = box1.max.y - box1.min.y;
    const s = (rawH > 0.001 && isFinite(rawH)) ? (TARGET_HEIGHT / rawH) : 0.0015;
    fbx.scale.setScalar(s);

    const box2 = computeExactSkinnedBox(fbx);
    if (!box2.isEmpty()) {
      const cx = (box2.min.x + box2.max.x) * 0.5;
      const cz = (box2.min.z + box2.max.z) * 0.5;
      fbx.position.set(-cx, -box2.min.y, -cz);
    }

    // Android WebXR is already 100% ready! Enable button immediately.
    if (hasWebXR) {
      xrBtn.disabled = false;
      xrBtn.textContent = 'Open AR camera';
    }

    // Export in-memory GLB for <model-viewer> (3D preview + iOS AR Quick Look + Android Scene Viewer)
    loadText.textContent = 'Preparing AR preview…';
    bar.style.width = '95%';
    await new Promise(r => setTimeout(r, 20));

    try {
      const exporter = new GLTFExporter();
      let glbBuffer;
      try {
        glbBuffer = await exporter.parseAsync(ghostGroup, {
          binary: true,
          maxTextureSize: 1024,
          animations: ghostAnims
        });
      } catch (animErr) {
        console.warn('GLTF export with animations failed, retrying without animations:', animErr);
        glbBuffer = await exporter.parseAsync(ghostGroup, {
          binary: true,
          maxTextureSize: 1024
        });
      }

      if (glbBlobUrl) URL.revokeObjectURL(glbBlobUrl);
      glbBlobUrl = URL.createObjectURL(new Blob([glbBuffer], { type: 'model/gltf-binary' }));
      if (IOS_USDZ_URL) mv.setAttribute('ios-src', IOS_USDZ_URL);
      mv.src = glbBlobUrl;
    } catch (expErr) {
      console.error('GLTFExporter error:', expErr);
      if (!hasWebXR) throw new Error('Preview conversion failed: ' + (expErr.message || expErr));
    }

    bar.style.width = '100%';
    loaderEl.classList.add('hidden');
  } catch (err) {
    console.error('Model load error:', err);
    loadText.textContent = 'Could not load model: ' + (err && err.message ? err.message : 'Network/parse error');
    bar.style.width = '0%';
    retryBtn.style.display = 'inline-block';
    if (hasWebXR && !ghostGroup) xrBtn.textContent = 'Model unavailable';
  }
}

retryBtn.onclick = loadFBXModel;
loadFBXModel();

// ---- Android Chrome WebXR (True 6-DoF ARCore Table Search & World Lock) ----
xrBtn.onclick = async () => {
  if (!ghostGroup) return;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.setFramebufferScaleFactor(0.85);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.xr.enabled = true;
  Object.assign(renderer.domElement.style, { position: 'fixed', inset: 0, zIndex: 0 });
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.2));
  const dirLight = new THREE.DirectionalLight(0xfff8ee, 2.2);
  dirLight.position.set(1.5, 3, 2);
  scene.add(dirLight);

  // Subtle scanning ring shown ONLY while searching for the table surface
  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.06, 0.08, 36).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xff6a1a, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Add Ghost (hidden until the real table surface is found!)
  ghostGroup.visible = false;
  ghostGroup.position.set(0, 0, 0);
  ghostGroup.rotation.set(0, 0, 0);
  ghostGroup.scale.set(1, 1, 1);
  scene.add(ghostGroup);

  let mixer = null;
  if (ghostAnims.length > 0) {
    mixer = new THREE.AnimationMixer(ghostGroup.children[0]);
    const clip = ghostAnims.find(a => /salute|mixamo/i.test(a.name)) || ghostAnims[0];
    mixer.clipAction(clip).play();
  }

  const ov = $('overlay'), status = $('status');
  ov.style.display = 'block';
  status.style.display = 'block';
  status.textContent = 'Move phone slowly to scan the table…';

  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'dom-overlay', 'anchors'],
      domOverlay: { root: ov }
    });
  } catch (e) {
    ov.style.display = 'none';
    renderer.domElement.remove();
    renderer.dispose();
    note.textContent = 'Could not start AR. Allow camera access and try again.';
    return;
  }

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  const refSpace = renderer.xr.getReferenceSpace();

  let hitSource = null;
  session.requestReferenceSpace('viewer')
    .then(sp => session.requestHitTestSource({ space: sp }))
    .then(hs => { hitSource = hs; })
    .catch(() => { hitSource = null; });

  $('exit').onclick = () => session.end();
  session.addEventListener('end', () => {
    renderer.setAnimationLoop(null);
    if (hitSource) { try { hitSource.cancel(); } catch (_) {} }
    ov.style.display = 'none';
    renderer.domElement.remove();
    renderer.dispose();
  });

  const clock = new THREE.Clock();
  const q = new THREE.Quaternion();
  const upVec = new THREE.Vector3();
  const hitMat = new THREE.Matrix4();
  const lastHitPos = new THREE.Vector3();

  let placed = false;
  let stableFrames = 0;
  let worldAnchor = null;

  renderer.setAnimationLoop((t, frame) => {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (mixer) mixer.update(dt);

    if (frame) {
      if (!placed && hitSource) {
        const hits = frame.getHitTestResults(hitSource);
        let foundTable = false;

        for (let i = 0; i < hits.length; i++) {
          const hit = hits[i];
          const pose = hit.getPose(refSpace);
          if (!pose) continue;

          const o = pose.transform.orientation;
          q.set(o.x, o.y, o.z, o.w);
          upVec.set(0, 1, 0).applyQuaternion(q);

          // Confirm horizontal table surface
          if (upVec.y > 0.90) {
            foundTable = true;
            hitMat.fromArray(pose.transform.matrix);
            reticle.matrix.copy(hitMat);
            reticle.visible = true;

            const pp = pose.transform.position;
            if (stableFrames === 0 || Math.hypot(pp.x - lastHitPos.x, pp.y - lastHitPos.y, pp.z - lastHitPos.z) < 0.05) {
              stableFrames++;
            } else {
              stableFrames = 1;
            }
            lastHitPos.set(pp.x, pp.y, pp.z);

            // Wait for 6 consecutive stable table frames so the surface height & spot are rock-solid
            if (stableFrames >= 6) {
              const vp = frame.getViewerPose(refSpace);
              ghostGroup.position.set(pp.x, pp.y, pp.z);
              if (vp) {
                const p = vp.transform.position;
                ghostGroup.rotation.set(0, Math.atan2(p.x - pp.x, p.z - pp.z), 0); // Face viewer
              }
              ghostGroup.visible = true;
              reticle.visible = false;
              placed = true;

              // Create persistent ARCore world anchor so model stays locked while walking 360° around it
              if (typeof hit.createAnchor === 'function') {
                hit.createAnchor().then(a => { worldAnchor = a; }).catch(() => {});
              }

              // Stop scanning — model will NOT move anymore; user can walk phone 360° around it!
              hitSource.cancel();
              hitSource = null;

              status.textContent = 'Table found! Walk around to view Ghost.';
              setTimeout(() => { status.style.display = 'none'; }, 2500);
            }
            break;
          }
        }
        if (!foundTable) {
          reticle.visible = false;
          stableFrames = 0;
        }
      } else if (placed && worldAnchor && frame.trackedAnchors && frame.trackedAnchors.has(worldAnchor)) {
        // Keep Ghost locked to the real-world ARCore anchor as user walks around the table
        const anchorPose = frame.getPose(worldAnchor.anchorSpace, refSpace);
        if (anchorPose) {
          const ap = anchorPose.transform.position;
          ghostGroup.position.set(ap.x, ap.y, ap.z);
        }
      }
    }

    renderer.render(scene, camera);
  });
};
</script>
</body>
</html>
