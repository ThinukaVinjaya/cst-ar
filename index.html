<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CST LAN Challenge – AR Squad</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#14170f;--ink:#ecebdc;--mute:#9a9f86;--flare:#ff6a1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 20px 4px}
h1{margin:0;font-size:2.3rem;line-height:1}
header p{margin:6px 0 0;color:var(--mute);font-size:1.1rem}
model-viewer{flex:1;min-height:0;width:100%;background:radial-gradient(circle at 50% 55%,#2d3521,#14170f 72%);--poster-color:transparent}
#ar{position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer}
#ar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#note{margin:0;padding:8px 20px;color:var(--mute);text-align:center;min-height:2.4em}
#xr{display:none;position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer}
#xr:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#overlay{display:none;position:fixed;inset:0;pointer-events:none}
#status{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;text-align:center;background:rgba(20,23,15,.8);color:var(--ink);padding:10px;font-size:1.2rem}
#exit{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;padding:12px 28px;font:inherit;font-size:1.2rem;background:rgba(20,23,15,.85);color:var(--ink);border:1px solid #3a4128}
</style>
</head>
<body>
<header>
  <h1>CST LAN Challenge</h1>
  <p>Tap the button, point your camera at the loot box, and hold the phone steady.</p>
</header>
<model-viewer id="mv" src="models/squad.glb" ios-src="models/squad.usdz" alt="Animated soldiers walking in a ring" autoplay animation-name="Patrol"
  camera-controls camera-orbit="30deg 70deg auto" shadow-intensity="1" interaction-prompt="none"
  ar ar-modes="scene-viewer webxr quick-look" ar-placement="floor" ar-scale="fixed" loading="eager">
  <button slot="ar-button" id="ar">Open AR camera</button>
</model-viewer>
<button id="xr">Open AR camera</button>
<div id="overlay"><div id="status"></div><button id="exit">Close</button></div>
<p id="note">Allow camera access. The squad places itself on the table around the box. No touching needed.</p>
<script>
const mv=document.getElementById('mv');
mv.addEventListener('load',()=>{ if(!mv.canActivateAR) document.getElementById('note').textContent='AR is not supported on this phone or browser. On iPhone use Safari; on Android use Chrome.'; });
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id), mv=$('mv');
/* Android Chrome (WebXR): the squad appears INSTANTLY in front of the camera on the table, animated, no scanning and no touch.
   If the phone finds the table surface it quietly snaps the squad's height to it. iPhone: falls back to the built-in viewer. */
const ok=navigator.xr && await Promise.race([navigator.xr.isSessionSupported('immersive-ar').catch(()=>false), new Promise(r=>setTimeout(()=>r(false),2000))]);
if(ok){ mv.removeAttribute('ar'); $('xr').style.display='block'; $('xr').disabled=true; $('xr').textContent='Loading squad…'; $('note').textContent='Tap the button and point at the loot box. The squad appears straight away.'; }
const DIST=0.55, DROP=0.42;            // metres ahead of the phone, metres below the phone (typical table distance)
let renderer,scene,camera,mixer,squad,session,hitSource,refSpace,gltf,placed,targetY,snapped;
const preload=ok?new GLTFLoader().loadAsync('models/squad_lite.glb').then(g=>{gltf=g; $('xr').disabled=false; $('xr').textContent='Open AR camera';}).catch(()=>{ $('xr').disabled=false; $('xr').textContent='Open AR camera'; }):null;   // load while the student reads the page, so AR opens instantly
$('xr').onclick=async()=>{
  if(!gltf) await preload;
  if(!gltf) gltf=await new GLTFLoader().loadAsync('models/squad_lite.glb');
  renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance'}); renderer.setPixelRatio(1); renderer.xr.setFramebufferScaleFactor(0.8); renderer.setSize(innerWidth,innerHeight); renderer.xr.enabled=true;
  Object.assign(renderer.domElement.style,{position:'fixed',inset:0,zIndex:0}); document.body.appendChild(renderer.domElement);
  scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera();
  scene.add(new THREE.HemisphereLight(0xffffff,0x666655,2.4)); const d=new THREE.DirectionalLight(0xffffff,2); d.position.set(1,3,1); scene.add(d);
  squad=gltf.scene; squad.visible=false; squad.traverse(o=>o.frustumCulled=false); scene.add(squad);
  const patrol=gltf.animations.find(a=>a.name==='Patrol')||gltf.animations[0]; mixer=new THREE.AnimationMixer(squad); mixer.clipAction(patrol).play();
  const ringNode=squad.getObjectByName('ring'), LAP=10*patrol.duration;   // ring is turned here (one walk cycle in the file keeps it small)
  placed=false; snapped=false; hitSource=null;
  const ov=$('overlay'); ov.style.display='block'; $('status').style.display='block'; $('status').textContent='Point at the loot box';
  try{ session=await navigator.xr.requestSession('immersive-ar',{optionalFeatures:['hit-test','dom-overlay'],domOverlay:{root:ov}}); }
  catch(e){ ov.style.display='none'; renderer.domElement.remove(); $('note').textContent='Could not start AR. Allow camera access and try again.'; return; }
  renderer.xr.setReferenceSpaceType('local'); await renderer.xr.setSession(session);
  refSpace=renderer.xr.getReferenceSpace();
  session.requestReferenceSpace('viewer').then(sp=>session.requestHitTestSource({space:sp})).then(hs=>hitSource=hs).catch(()=>{ hitSource=null; });   // optional, never blocks the start
  $('exit').onclick=()=>session.end();
  session.addEventListener('end',()=>{ renderer.setAnimationLoop(null); ov.style.display='none'; renderer.domElement.remove(); renderer.dispose(); });
  const clock=new THREE.Clock(), q=new THREE.Quaternion(), f=new THREE.Vector3(), v=new THREE.Vector3();
  renderer.setAnimationLoop((t,frame)=>{
    const dt=Math.min(clock.getDelta(),0.1); mixer.update(dt); if(ringNode) ringNode.rotation.y-=dt*2*Math.PI/LAP;
    if(frame){
      if(!placed){ const vp=frame.getViewerPose(refSpace);
        if(vp){ const p=vp.transform.position, o=vp.transform.orientation; q.set(o.x,o.y,o.z,o.w);
          f.set(0,0,-1).applyQuaternion(q); f.y=0;
          if(f.length()<0.3){ f.set(0,1,0).applyQuaternion(q); f.y=0; }        // phone pointing straight down: use the top of the phone as "forward"
          f.normalize();
          squad.position.set(p.x+f.x*DIST, p.y-DROP, p.z+f.z*DIST); targetY=squad.position.y; squad.visible=true; placed=true;
          setTimeout(()=>$('status').style.display='none',2500); } }
      else if(hitSource && !snapped){            // optional: correct the height to the real table when a surface is seen
        const hits=frame.getHitTestResults(hitSource); const pose=hits[0]&&hits[0].getPose(refSpace);
        if(pose){ const pp=pose.transform.position, o=pose.transform.orientation; q.set(o.x,o.y,o.z,o.w); v.set(0,1,0).applyQuaternion(q);
          if(v.y>0.9 && Math.hypot(pp.x-squad.position.x,pp.z-squad.position.z)<0.5 && Math.abs(pp.y-squad.position.y)<0.6){ targetY=pp.y; snapped=true; hitSource.cancel(); } } }
      if(placed) squad.position.y+=(targetY-squad.position.y)*Math.min(1,dt*6);
    }
    renderer.render(scene,camera); });
};
</script>
</body>
</html>
