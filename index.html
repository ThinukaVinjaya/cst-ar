<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CST LAN Challenge – Ghost Salute AR</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root{--bg:#14170f;--ink:#ecebdc;--mute:#9a9f86;--flare:#ff6a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 20px 6px}
h1{margin:0;font-size:2.3rem;line-height:1}
header p{margin:6px 0 0;color:var(--mute);font-size:1.1rem}
#stage{position:relative;flex:1;min-height:0;width:100%;background:radial-gradient(circle at 50% 55%,#2d3521,#14170f 72%);overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(20,23,15,.82);z-index:4}
#loader.hidden{display:none}
.bar-wrap{width:min(260px,78%);height:8px;background:#262c1c;border:1px solid #3a4128;border-radius:4px;overflow:hidden}
#bar{height:100%;width:0%;background:var(--flare);transition:width .15s linear}
#load-text{font-size:1.15rem;color:var(--ink);max-width:340px}
#retry{display:none;padding:10px 22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.15rem;font-weight:700;border-radius:4px;cursor:pointer}
.ar-cta{display:none;position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;border-radius:4px;z-index:5}
.ar-cta:disabled{opacity:.6;cursor:default}
.ar-cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#ios-ar img{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#cam-bg{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:10;background:#000}
body.ios-ar-active #cam-bg{display:block}
body.ios-ar-active #stage{position:fixed;inset:0;width:100%;height:100%;background:transparent;z-index:15}
body.ios-ar-active .ar-cta{display:none!important}
#note{margin:0;padding:8px 20px;color:var(--mute);text-align:center;min-height:2.4em;font-size:1.05rem}
#overlay{display:none;position:fixed;inset:0;pointer-events:none;z-index:25}
#status{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;text-align:center;background:rgba(20,23,15,.85);color:var(--ink);padding:10px 16px;font-size:1.2rem;border-radius:4px}
#exit{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;padding:12px 28px;font:inherit;font-size:1.2rem;background:rgba(20,23,15,.9);color:var(--ink);border:1px solid #3a4128;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>CST LAN Challenge</h1>
  <p>Tap Open AR camera, scan the table, and walk 360° around Ghost.</p>
</header>

<video id="cam-bg" autoplay muted playsinline></video>
<div id="stage">
  <div id="loader">
    <div id="load-text">Downloading Ghost Salute…</div>
    <div class="bar-wrap"><div id="bar"></div></div>
    <button id="retry">Retry</button>
  </div>
  <button id="xr" class="ar-cta" disabled>Loading Ghost…</button>
  <a id="android-sv" class="ar-cta" href="#">Open AR camera</a>
  <button id="ios-ar" class="ar-cta" disabled>Loading Ghost…</button>
</div>

<div id="overlay">
  <div id="status"></div>
  <button id="exit">Close</button>
</div>
<p id="note">Loading animated FBX model from S3…</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const MODEL_URL = 'https://cst-lan.s3.eu-north-1.amazonaws.com/Gost+Salute.fbx';
const TARGET_HEIGHT = 0.25; // 25 cm tabletop height (set to 1.8 for life-size)

const $ = id => document.getElementById(id);
const stage = $('stage'), xrBtn = $('xr'), androidSvBtn = $('android-sv'), iosBtn = $('ios-ar'), note = $('note');
const camBg = $('cam-bg');
const loaderEl = $('loader'), loadText = $('load-text'), bar = $('bar'), retryBtn = $('retry');
const ov = $('overlay'), statusEl = $('status');

// ---- Preview Three.js Renderer & Scene (Plays S3 FBX + Skeletal Animation Directly) ----
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, stage.clientWidth / Math.max(stage.clientHeight, 1), 0.01, 50);
camera.position.set(0, 0.20, 0.56);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.12, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.22;
controls.maxDistance = 2.0;
controls.update();

// Preview Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x555c4a, 2.2));
const keyLight = new THREE.DirectionalLight(0xfff8ee, 2.2);
keyLight.position.set(1.5, 3.0, 2.0);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xcce0ff, 0.9);
rimLight.position.set(-1.5, 1.5, -2.0);
scene.add(rimLight);

// Preview-only floor grid
const previewFloor = new THREE.PolarGridHelper(0.28, 8, 4, 48, 0x4b5736, 0x2c3420);
scene.add(previewFloor);

// Outer root -> inner fbxWrap (handles scale/orientation/grounding without touching FBX skeleton!)
const modelRoot = new THREE.Group();
const fbxWrap = new THREE.Group();
modelRoot.add(fbxWrap);
scene.add(modelRoot);

let mixer = null;
let loadedFbx = null;
let activeClip = null;
let skinnedMeshes = [];
let modelReady = false;

// ---- Detect Android WebXR vs Android Scene Viewer Fallback vs iPhone Safari Quick Look ----
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(navigator.userAgent);

const hasWebXR = !!(navigator.xr && await Promise.race([
  navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
  new Promise(r => setTimeout(() => r(false), 2000))
]));

// Configure Google Scene Viewer fallback URL (only shown on Android devices without WebXR)
if (isAndroid && !hasWebXR) {
  const glbUrl = new URL('models/ghost_salute.glb?v=3', window.location.href).href;
  const fallbackUrl = encodeURIComponent(window.location.href);
  androidSvBtn.href =
    `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbUrl)}&mode=ar_only&resizable=false&title=Ghost+Salute` +
    `#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${fallbackUrl};end;`;
}

function updateButtons() {
  if (hasWebXR) {
    xrBtn.style.display = 'block';
    androidSvBtn.style.display = 'none';
    iosBtn.style.display = 'none';
    xrBtn.disabled = !modelReady;
    xrBtn.textContent = modelReady ? 'Open AR camera' : 'Loading Ghost…';
    if (modelReady) note.textContent = 'Tap Open AR camera, scan the table, then walk 360° around Ghost.';
  } else if (isIOS) {
    xrBtn.style.display = 'none';
    androidSvBtn.style.display = 'none';
    iosBtn.style.display = 'block';
    iosBtn.disabled = !modelReady;
    iosBtn.textContent = modelReady ? 'Open AR camera' : 'Loading Ghost…';
    if (modelReady) note.textContent = 'Tap Open AR camera to place animated Ghost directly from your S3 model URL.';
  } else if (isAndroid) {
    xrBtn.style.display = 'none';
    androidSvBtn.style.display = 'block';
    iosBtn.style.display = 'none';
    if (modelReady) note.textContent = 'Tap Open AR camera, scan the table, and walk 360° around Ghost.';
  } else {
    xrBtn.style.display = 'none';
    androidSvBtn.style.display = 'none';
    iosBtn.style.display = 'none';
    if (modelReady) note.textContent = '3D animated preview active. Open on Android Chrome or iPhone Safari for AR.';
  }
}
updateButtons();

function refreshSkeletons() {
  if (loadedFbx) loadedFbx.updateMatrixWorld(true);
  for (let i = 0; i < skinnedMeshes.length; i++) {
    const m = skinnedMeshes[i];
    if (m.skeleton) {
      m.skeleton.update();
      if (m.skeleton.boneTexture) m.skeleton.boneTexture.needsUpdate = true;
    }
  }
}

function startClipOnMixer(targetFbx, clip) {
  if (!targetFbx || !clip) return null;
  const m = new THREE.AnimationMixer(targetFbx);
  const action = m.clipAction(clip);
  action.reset();
  action.enabled = true;
  action.paused = false;
  action.timeScale = 1;
  action.setEffectiveWeight(1);
  action.setLoop(THREE.LoopRepeat, Infinity);
  action.play();
  m.update(0.016);
  refreshSkeletons();
  return m;
}

// Compute exact world-space bounding box of posed SkinnedMeshes
function computeExactSkinnedBox(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  const v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    const pos = o.geometry.attributes.position;
    if (!pos || pos.count === 0) return;
    if (o.isSkinnedMesh && o.skeleton) {
      try { o.skeleton.update(); } catch (_) {}
    }
    const step = Math.max(1, Math.floor(pos.count / 4000));
    for (let i = 0; i < pos.count; i += step) {
      try {
        if (o.isSkinnedMesh && typeof o.getVertexPosition === 'function') {
          o.getVertexPosition(i, v);
        } else {
          v.fromBufferAttribute(pos, i);
        }
      } catch (_) {
        v.fromBufferAttribute(pos, i);
      }
      v.applyMatrix4(o.matrixWorld);
      if (isFinite(v.x) && isFinite(v.y) && isFinite(v.z)) box.expandByPoint(v);
    }
  });
  return box;
}

// Streaming fetch with live % and MB progress
async function fetchArrayBufferWithProgress(url, onProgress) {
  const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
  if (!res.ok) throw new Error(`HTTP ${res.status} fetching FBX`);
  const total = Number(res.headers.get('content-length')) || 0;
  if (!res.body) return await res.arrayBuffer();

  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.byteLength;
    onProgress(loaded, total);
  }
  const out = new Uint8Array(loaded);
  let offset = 0;
  for (const c of chunks) { out.set(c, offset); offset += c.byteLength; }
  return out.buffer;
}

// ---- Load S3 FBX Model WITH Full Embedded Skeletal Animation ----
async function loadFBXModel() {
  loaderEl.classList.remove('hidden');
  retryBtn.style.display = 'none';
  bar.style.width = '5%';
  loadText.textContent = 'Downloading Ghost Salute…';
  modelReady = false;
  updateButtons();

  try {
    const buffer = await fetchArrayBufferWithProgress(MODEL_URL, (loaded, total) => {
      if (total > 0) {
        const pct = Math.min(92, Math.round((loaded / total) * 92));
        bar.style.width = pct + '%';
        loadText.textContent = `Downloading Ghost Salute… ${pct}% (${(loaded / 1048576).toFixed(1)} MB)`;
      } else {
        bar.style.width = '45%';
        loadText.textContent = `Downloading Ghost Salute… ${(loaded / 1048576).toFixed(1)} MB`;
      }
    });

    loadText.textContent = 'Starting FBX & Salute animation…';
    bar.style.width = '96%';
    await new Promise(r => setTimeout(r, 20));

    const fbxLoader = new FBXLoader();
    const basePath = MODEL_URL.substring(0, MODEL_URL.lastIndexOf('/') + 1);
    const fbx = fbxLoader.parse(buffer, basePath);

    // Keep FBX bone names & bindMatrices 100% UNTOUCHED so all skeletal animation tracks play natively!
    skinnedMeshes = [];
    fbx.traverse(o => {
      if (!o.isMesh) return;
      o.frustumCulled = false;
      if (o.isSkinnedMesh) skinnedMeshes.push(o);
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => {
        if (!m) return;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        if (m.shininess !== undefined) m.shininess = Math.min(m.shininess, 25);
      });
    });

    if (loadedFbx) fbxWrap.remove(loadedFbx);
    loadedFbx = fbx;
    fbxWrap.position.set(0, 0, 0);
    fbxWrap.rotation.set(0, 0, 0);
    fbxWrap.scale.set(1, 1, 1);
    fbxWrap.add(fbx);

    // Start embedded FBX Salute animation directly on fbx via AnimationMixer
    if (fbx.animations && fbx.animations.length > 0) {
      activeClip = fbx.animations.find(a => a.tracks && a.tracks.length > 0) || fbx.animations[0];
      mixer = startClipOnMixer(fbx, activeClip);
      console.log('Playing FBX animation:', activeClip.name, 'tracks:', activeClip.tracks.length, 'duration:', activeClip.duration.toFixed(2) + 's');
    } else {
      activeClip = null;
      mixer = null;
      console.warn('No animation clips found inside FBX.');
    }

    // Auto-orient upright & scale to 25 cm tabletop height using the OUTER fbxWrap (never breaking FBX skeleton!)
    const box0 = computeExactSkinnedBox(fbxWrap);
    const dx0 = box0.max.x - box0.min.x;
    const dy0 = box0.max.y - box0.min.y;
    const dz0 = box0.max.z - box0.min.z;
    if (dz0 > dy0 * 1.4 && dz0 > dx0) {
      fbxWrap.rotation.x = -Math.PI / 2;
      fbxWrap.updateMatrixWorld(true);
    }

    const box1 = computeExactSkinnedBox(fbxWrap);
    const rawH = box1.max.y - box1.min.y;
    const s = (rawH > 0.0001 && isFinite(rawH)) ? (TARGET_HEIGHT / rawH) : 13.1;
    fbxWrap.scale.setScalar(s);

    const box2 = computeExactSkinnedBox(fbxWrap);
    if (!box2.isEmpty()) {
      const cx = (box2.min.x + box2.max.x) * 0.5;
      const cz = (box2.min.z + box2.max.z) * 0.5;
      fbxWrap.position.set(-cx, -box2.min.y, -cz);
    }

    modelReady = true;
    bar.style.width = '100%';
    loaderEl.classList.add('hidden');
    updateButtons();
  } catch (err) {
    console.error('FBX load error:', err);
    loadText.textContent = 'Could not load model: ' + (err && err.message ? err.message : 'Network/parse error');
    bar.style.width = '0%';
    retryBtn.style.display = 'inline-block';
    updateButtons();
  }
}

retryBtn.onclick = loadFBXModel;
loadFBXModel();

// ---- Preview & iOS Live-Camera Render + Animation Loop ----
let lastPreviewTick = performance.now();
let iosCameraActive = false;
let iosHasGyro = false;
const iosTargetQuat = new THREE.Quaternion();

function previewLoop() {
  const now = performance.now();
  const dt = Math.min(Math.max((now - lastPreviewTick) / 1000, 0.001), 0.1);
  lastPreviewTick = now;
  if (mixer) {
    mixer.update(dt);
    refreshSkeletons();
  }
  if (iosCameraActive) {
    if (iosHasGyro) {
      camera.quaternion.slerp(iosTargetQuat, Math.min(1, dt * 14));
    }
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(previewLoop);

// ---- Android Chrome WebXR (Dedicated WebXR Renderer + Fresh AnimationMixer + 6-DoF Table Anchor) ----
let xrSession = null;

xrBtn.onclick = async () => {
  if (!modelReady || !loadedFbx || xrSession) return;

  ov.style.display = 'block';
  statusEl.style.display = 'block';
  statusEl.textContent = 'Move phone slowly to scan the table…';

  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'dom-overlay', 'anchors'],
      domOverlay: { root: ov }
    });
  } catch (e) {
    ov.style.display = 'none';
    note.textContent = 'Could not start AR. Allow camera access and try again.';
    return;
  }
  xrSession = session;

  // Pause preview loop & preview mixer so WebXR has exclusive control of loadedFbx + GPU
  renderer.setAnimationLoop(null);
  controls.enabled = false;
  if (mixer) {
    mixer.stopAllAction();
    mixer.uncacheRoot(loadedFbx);
    mixer = null;
  }

  // Dedicated high-performance WebXR renderer (full viewport, pixelRatio=1, framebufferScaleFactor=0.8)
  const arRenderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
  arRenderer.setPixelRatio(1);
  arRenderer.xr.setFramebufferScaleFactor(0.8);
  arRenderer.setSize(window.innerWidth, window.innerHeight);
  arRenderer.outputColorSpace = THREE.SRGBColorSpace;
  arRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  arRenderer.toneMappingExposure = 1.1;
  arRenderer.xr.enabled = true;
  Object.assign(arRenderer.domElement.style, { position: 'fixed', inset: '0', zIndex: '0' });
  document.body.appendChild(arRenderer.domElement);

  const arScene = new THREE.Scene();
  const arCamera = new THREE.PerspectiveCamera();
  arScene.add(new THREE.HemisphereLight(0xffffff, 0x555c4a, 2.4));
  const arKey = new THREE.DirectionalLight(0xfff8ee, 2.2);
  arKey.position.set(1.5, 3.0, 2.0);
  arScene.add(arKey);
  const arRim = new THREE.DirectionalLight(0xcce0ff, 0.9);
  arRim.position.set(-1.5, 1.5, -2.0);
  arScene.add(arRim);

  const arReticle = new THREE.Mesh(
    new THREE.RingGeometry(0.06, 0.08, 36).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xff6a1a, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  arReticle.matrixAutoUpdate = false;
  arReticle.visible = false;
  arScene.add(arReticle);

  // Move animated fbxWrap into arModelRoot and bind a fresh AnimationMixer directly inside the XR session
  const arModelRoot = new THREE.Group();
  arModelRoot.visible = false;
  arModelRoot.add(fbxWrap);
  arScene.add(arModelRoot);

  const arMixer = startClipOnMixer(loadedFbx, activeClip);

  let hitSource = null;
  let refSpace = null;
  let xrPlaced = false;
  let stableFrames = 0;
  let worldAnchor = null;

  let cleanedUp = false;
  function cleanupAR() {
    if (cleanedUp) return;
    cleanedUp = true;
    arRenderer.setAnimationLoop(null);
    if (hitSource) { try { hitSource.cancel(); } catch (_) {} hitSource = null; }
    if (arMixer) {
      arMixer.stopAllAction();
      arMixer.uncacheRoot(loadedFbx);
    }
    arRenderer.domElement.remove();
    arRenderer.dispose();

    xrSession = null;
    ov.style.display = 'none';

    // Restore fbxWrap back to preview scene and resume preview Salute animation
    modelRoot.add(fbxWrap);
    modelRoot.visible = true;
    modelRoot.position.set(0, 0, 0);
    modelRoot.rotation.set(0, 0, 0);
    mixer = startClipOnMixer(loadedFbx, activeClip);

    camera.position.set(0, 0.20, 0.56);
    controls.target.set(0, 0.12, 0);
    controls.enabled = true;
    controls.update();
    onResize();
    lastPreviewTick = performance.now();
    renderer.setAnimationLoop(previewLoop);
  }

  session.addEventListener('end', cleanupAR);

  try {
    arRenderer.xr.setReferenceSpaceType('local');
    await arRenderer.xr.setSession(session);
    refSpace = arRenderer.xr.getReferenceSpace();
  } catch (e) {
    try { await session.end(); } catch (_) {}
    cleanupAR();
    note.textContent = 'Could not attach WebXR session. Try again.';
    return;
  }

  session.requestReferenceSpace('viewer')
    .then(sp => session.requestHitTestSource({ space: sp }))
    .then(hs => { hitSource = hs; })
    .catch(() => { hitSource = null; });

  const q = new THREE.Quaternion();
  const upVec = new THREE.Vector3();
  const hitMat = new THREE.Matrix4();
  const lastHitPos = new THREE.Vector3();
  let lastXrTime = null;

  // Start WebXR animation loop AFTER setSession so XRFrame drives every animation step cleanly
  arRenderer.setAnimationLoop((t, frame) => {
    const now = (typeof t === 'number' && isFinite(t)) ? t : performance.now();
    let dt = lastXrTime === null ? 0.016 : (now - lastXrTime) / 1000;
    lastXrTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 0.016;
    if (dt > 0.1) dt = 0.1;

    if (arMixer) {
      arMixer.update(dt);
      refreshSkeletons();
    }

    if (frame) {
      if (!xrPlaced && hitSource) {
        const hits = frame.getHitTestResults(hitSource);
        let foundTable = false;

        for (let i = 0; i < hits.length; i++) {
          const hit = hits[i];
          const pose = hit.getPose(refSpace);
          if (!pose) continue;

          const o = pose.transform.orientation;
          q.set(o.x, o.y, o.z, o.w);
          upVec.set(0, 1, 0).applyQuaternion(q);

          if (upVec.y > 0.90) {
            foundTable = true;
            hitMat.fromArray(pose.transform.matrix);
            arReticle.matrix.copy(hitMat);
            arReticle.visible = true;

            const pp = pose.transform.position;
            if (stableFrames === 0 || Math.hypot(pp.x - lastHitPos.x, pp.y - lastHitPos.y, pp.z - lastHitPos.z) < 0.05) {
              stableFrames++;
            } else {
              stableFrames = 1;
            }
            lastHitPos.set(pp.x, pp.y, pp.z);

            if (stableFrames >= 6) {
              const vp = frame.getViewerPose(refSpace);
              arModelRoot.position.set(pp.x, pp.y, pp.z);
              if (vp) {
                const p = vp.transform.position;
                arModelRoot.rotation.set(0, Math.atan2(p.x - pp.x, p.z - pp.z), 0);
              }
              arModelRoot.visible = true;
              arReticle.visible = false;
              xrPlaced = true;

              if (typeof hit.createAnchor === 'function') {
                hit.createAnchor().then(a => { worldAnchor = a; }).catch(() => {});
              }

              hitSource.cancel();
              hitSource = null;

              statusEl.textContent = 'Table found! Walk 360° around Ghost.';
              setTimeout(() => { statusEl.style.display = 'none'; }, 2500);
            }
            break;
          }
        }
        if (!foundTable) {
          arReticle.visible = false;
          stableFrames = 0;
        }
      } else if (xrPlaced && worldAnchor && frame.trackedAnchors && frame.trackedAnchors.has(worldAnchor)) {
        const anchorPose = frame.getPose(worldAnchor.anchorSpace, refSpace);
        if (anchorPose) {
          const ap = anchorPose.transform.position;
          arModelRoot.position.set(ap.x, ap.y, ap.z);
        }
      }
    }

    arRenderer.render(arScene, arCamera);
  });
};

// ---- iOS Safari Live Camera AR (Uses Already-Loaded S3 FBX + Salute Animation Directly, Zero USDZ Download!) ----
let iosStream = null;
let iosPlaced = false;
const iosZee = new THREE.Vector3(0, 0, 1);
const iosEuler = new THREE.Euler();
const iosQ0 = new THREE.Quaternion();
const iosQ1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const iosFwd = new THREE.Vector3();

function getScreenOrientRad() {
  const angle = (screen.orientation && typeof screen.orientation.angle === 'number')
    ? screen.orientation.angle
    : (typeof window.orientation === 'number' ? window.orientation : 0);
  return THREE.MathUtils.degToRad(angle);
}

function placeGhostInFrontOfIosCamera(quat) {
  iosFwd.set(0, 0, -1).applyQuaternion(quat);
  let horizLen = Math.hypot(iosFwd.x, iosFwd.z);
  let hx = 0, hz = -1;
  if (horizLen > 0.05) {
    hx = iosFwd.x / horizLen;
    hz = iosFwd.z / horizLen;
  }
  // Project along gaze onto a virtual tabletop if looking down, otherwise place comfortably ahead
  let dist = 0.62;
  let yPos = -0.18;
  if (iosFwd.y < -0.15) {
    const tPlane = -0.35 / iosFwd.y;
    dist = Math.min(Math.max(tPlane * horizLen, 0.42), 0.88);
    yPos = -0.35;
  }
  modelRoot.position.set(hx * dist, yPos, hz * dist);
  modelRoot.rotation.set(0, Math.atan2(-hx, -hz), 0);
  modelRoot.visible = true;
}

function onIosDeviceOrientation(ev) {
  if (!iosCameraActive || ev.alpha === null || ev.beta === null || ev.gamma === null) return;
  const alpha = THREE.MathUtils.degToRad(ev.alpha);
  const beta = THREE.MathUtils.degToRad(ev.beta);
  const gamma = THREE.MathUtils.degToRad(ev.gamma);
  const orient = getScreenOrientRad();

  iosEuler.set(beta, alpha, -gamma, 'YXZ');
  iosTargetQuat.setFromEuler(iosEuler);
  iosTargetQuat.multiply(iosQ1);
  iosTargetQuat.multiply(iosQ0.setFromAxisAngle(iosZee, -orient));

  if (!iosHasGyro) {
    iosHasGyro = true;
    camera.quaternion.copy(iosTargetQuat);
  }
  if (!iosPlaced) {
    placeGhostInFrontOfIosCamera(iosTargetQuat);
    iosPlaced = true;
  }
}

function onIosStageTap() {
  if (!iosCameraActive) return;
  if (iosHasGyro) {
    placeGhostInFrontOfIosCamera(iosTargetQuat);
  } else {
    modelRoot.position.set(0, -0.15, -0.60);
    modelRoot.rotation.set(0, 0, 0);
  }
}

function stopIosCameraAR() {
  if (!iosCameraActive) return;
  iosCameraActive = false;
  iosHasGyro = false;
  iosPlaced = false;
  window.removeEventListener('deviceorientation', onIosDeviceOrientation);
  renderer.domElement.removeEventListener('pointerdown', onIosStageTap);

  if (iosStream) {
    iosStream.getTracks().forEach(tr => tr.stop());
    iosStream = null;
  }
  camBg.srcObject = null;
  document.body.classList.remove('ios-ar-active');
  ov.style.display = 'none';

  previewFloor.visible = true;
  modelRoot.visible = true;
  modelRoot.position.set(0, 0, 0);
  modelRoot.rotation.set(0, 0, 0);
  camera.position.set(0, 0.20, 0.56);
  camera.quaternion.identity();
  controls.target.set(0, 0.12, 0);
  controls.enabled = true;
  controls.update();
  onResize();
}

iosBtn.onclick = async () => {
  if (!modelReady || !loadedFbx || iosCameraActive) return;

  // Request iOS gyroscope permission inside user tap gesture
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch (_) {}
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    note.textContent = 'Camera access requires HTTPS in Safari.';
    return;
  }

  try {
    iosStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (e) {
    note.textContent = 'Could not open iPhone camera. Allow camera access in Safari settings and try again.';
    return;
  }

  camBg.srcObject = iosStream;
  try { await camBg.play(); } catch (_) {}

  iosCameraActive = true;
  iosHasGyro = false;
  iosPlaced = false;
  document.body.classList.add('ios-ar-active');
  ov.style.display = 'block';
  statusEl.style.display = 'block';
  statusEl.textContent = 'Point at the table — tap screen to reposition Ghost.';
  setTimeout(() => { if (iosCameraActive) statusEl.style.display = 'none'; }, 3000);

  controls.enabled = false;
  previewFloor.visible = false;
  camera.position.set(0, 0, 0);
  camera.quaternion.identity();
  modelRoot.position.set(0, -0.15, -0.60);
  modelRoot.rotation.set(0, 0, 0);
  modelRoot.visible = true;

  // Ensure S3 FBX Salute animation is actively running
  if (!mixer && activeClip) {
    mixer = startClipOnMixer(loadedFbx, activeClip);
  }

  onResize();
  window.addEventListener('deviceorientation', onIosDeviceOrientation);
  renderer.domElement.addEventListener('pointerdown', onIosStageTap);
};

$('exit').onclick = () => {
  if (xrSession) xrSession.end();
  if (iosCameraActive) stopIosCameraAR();
};

function onResize() {
  if (xrSession) return;
  const w = iosCameraActive ? window.innerWidth : stage.clientWidth;
  const h = Math.max(iosCameraActive ? window.innerHeight : stage.clientHeight, 1);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
</script>
