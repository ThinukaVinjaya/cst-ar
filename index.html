<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CST LAN Challenge – Ghost Salute AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{--bg:#14170f;--ink:#ecebdc;--mute:#9a9f86;--flare:#ff6a1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 20px 6px}
h1{margin:0;font-size:2.3rem;line-height:1}
header p{margin:6px 0 0;color:var(--mute);font-size:1.1rem}
#viewer-container{position:relative;flex:1;min-height:0;width:100%;display:flex}
model-viewer{flex:1;min-height:0;width:100%;background:radial-gradient(circle at 50% 55%,#2d3521,#14170f 72%);--poster-color:transparent}
#ar{position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer;border-radius:4px;z-index:3}
#ar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#xr{display:none;position:absolute;left:18px;right:18px;bottom:18px;padding:22px;background:var(--flare);color:#14170f;border:0;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer;border-radius:4px;z-index:5}
#xr:disabled{opacity:.6;cursor:default}
#xr:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#note{margin:0;padding:8px 20px;color:var(--mute);text-align:center;min-height:2.4em;font-size:1.05rem}
#overlay{display:none;position:fixed;inset:0;pointer-events:none}
#status{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;text-align:center;background:rgba(20,23,15,.85);color:var(--ink);padding:10px 16px;font-size:1.2rem;border-radius:4px}
#exit{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;padding:12px 28px;font:inherit;font-size:1.2rem;background:rgba(20,23,15,.9);color:var(--ink);border:1px solid #3a4128;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>CST LAN Challenge</h1>
  <p>Tap Open AR camera, scan the table, and walk around Ghost.</p>
</header>
<div id="viewer-container">
  <model-viewer id="mv" src="models/ghost_salute.glb" alt="Ghost Salute AR" autoplay animation-name="Salute"
    camera-controls camera-orbit="0deg 75deg 0.65m" shadow-intensity="1" interaction-prompt="none"
    ar ar-modes="quick-look scene-viewer webxr" ar-placement="floor" ar-scale="fixed" loading="eager">
    <button slot="ar-button" id="ar">Open AR camera</button>
  </model-viewer>
  <button id="xr" disabled>Loading Ghost…</button>
</div>
<div id="overlay">
  <div id="status"></div>
  <button id="exit">Close</button>
</div>
<p id="note">Allow camera access. Scan the table so Ghost locks in place, then walk 360° around him.</p>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_SRC = 'models/ghost_salute.glb';
const $ = id => document.getElementById(id);
const mv = $('mv'), xrBtn = $('xr'), note = $('note');

mv.addEventListener('load', () => {
  if (!hasWebXR && !mv.canActivateAR) {
    note.textContent = 'AR is not supported on this phone or browser. On iPhone use Safari; on Android use Chrome.';
  }
});

// Detect Android WebXR ARCore support (iPhone Safari automatically uses <model-viewer> Apple AR Quick Look)
const hasWebXR = !!(navigator.xr && await Promise.race([
  navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
  new Promise(r => setTimeout(() => r(false), 2000))
]));

let gltf = null;
let preload = null;

if (hasWebXR) {
  mv.removeAttribute('ar');
  xrBtn.style.display = 'block';
  xrBtn.disabled = true;
  xrBtn.textContent = 'Loading Ghost…';
  note.textContent = 'Tap Open AR camera, point at the table to scan, then walk around Ghost.';

  preload = new GLTFLoader().loadAsync(MODEL_SRC).then(g => {
    gltf = g;
    xrBtn.disabled = false;
    xrBtn.textContent = 'Open AR camera';
  }).catch(() => {
    xrBtn.disabled = false;
    xrBtn.textContent = 'Open AR camera';
  });
}

// ---- Android Chrome WebXR (True 6-DoF ARCore Table Search & World Anchor) ----
xrBtn.onclick = async () => {
  if (!gltf && preload) await preload;
  if (!gltf) gltf = await new GLTFLoader().loadAsync(MODEL_SRC);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.xr.setFramebufferScaleFactor(0.85);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.xr.enabled = true;
  Object.assign(renderer.domElement.style, { position: 'fixed', inset: 0, zIndex: 0 });
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.2));
  const dirLight = new THREE.DirectionalLight(0xfff8ee, 2.2);
  dirLight.position.set(1.5, 3, 2);
  scene.add(dirLight);

  // Subtle scanning ring shown ONLY while searching for the table surface
  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.06, 0.08, 36).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xff6a1a, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Ghost is already baked to exact 25 cm tabletop height with boots on y = 0
  const ghost = gltf.scene;
  ghost.visible = false;
  ghost.position.set(0, 0, 0);
  ghost.rotation.set(0, 0, 0);
  ghost.scale.set(1, 1, 1);
  ghost.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  scene.add(ghost);

  const clip = gltf.animations.find(a => a.name === 'Salute') || gltf.animations[0];
  const mixer = clip ? new THREE.AnimationMixer(ghost) : null;
  if (mixer) mixer.clipAction(clip).play();

  const ov = $('overlay'), status = $('status');
  ov.style.display = 'block';
  status.style.display = 'block';
  status.textContent = 'Move phone slowly to scan the table…';

  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test', 'dom-overlay', 'anchors'],
      domOverlay: { root: ov }
    });
  } catch (e) {
    ov.style.display = 'none';
    renderer.domElement.remove();
    renderer.dispose();
    note.textContent = 'Could not start AR. Allow camera access and try again.';
    return;
  }

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  const refSpace = renderer.xr.getReferenceSpace();

  let hitSource = null;
  session.requestReferenceSpace('viewer')
    .then(sp => session.requestHitTestSource({ space: sp }))
    .then(hs => { hitSource = hs; })
    .catch(() => { hitSource = null; });

  $('exit').onclick = () => session.end();
  session.addEventListener('end', () => {
    renderer.setAnimationLoop(null);
    if (hitSource) { try { hitSource.cancel(); } catch (_) {} }
    ov.style.display = 'none';
    renderer.domElement.remove();
    renderer.dispose();
  });

  const clock = new THREE.Clock();
  const q = new THREE.Quaternion();
  const upVec = new THREE.Vector3();
  const hitMat = new THREE.Matrix4();
  const lastHitPos = new THREE.Vector3();

  let placed = false;
  let stableFrames = 0;
  let worldAnchor = null;

  renderer.setAnimationLoop((t, frame) => {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (mixer) mixer.update(dt);

    if (frame) {
      if (!placed && hitSource) {
        const hits = frame.getHitTestResults(hitSource);
        let foundTable = false;

        for (let i = 0; i < hits.length; i++) {
          const hit = hits[i];
          const pose = hit.getPose(refSpace);
          if (!pose) continue;

          const o = pose.transform.orientation;
          q.set(o.x, o.y, o.z, o.w);
          upVec.set(0, 1, 0).applyQuaternion(q);

          // Confirm real horizontal table plane
          if (upVec.y > 0.90) {
            foundTable = true;
            hitMat.fromArray(pose.transform.matrix);
            reticle.matrix.copy(hitMat);
            reticle.visible = true;

            const pp = pose.transform.position;
            if (stableFrames === 0 || Math.hypot(pp.x - lastHitPos.x, pp.y - lastHitPos.y, pp.z - lastHitPos.z) < 0.05) {
              stableFrames++;
            } else {
              stableFrames = 1;
            }
            lastHitPos.set(pp.x, pp.y, pp.z);

            // Lock onto table once 6 consecutive consistent hits confirm a flat surface
            if (stableFrames >= 6) {
              const vp = frame.getViewerPose(refSpace);
              ghost.position.set(pp.x, pp.y, pp.z);
              if (vp) {
                const p = vp.transform.position;
                ghost.rotation.set(0, Math.atan2(p.x - pp.x, p.z - pp.z), 0); // Face user
              }
              ghost.visible = true;
              reticle.visible = false;
              placed = true;

              // Persistent ARCore world anchor keeps Ghost locked as user walks 360° around him
              if (typeof hit.createAnchor === 'function') {
                hit.createAnchor().then(a => { worldAnchor = a; }).catch(() => {});
              }

              hitSource.cancel();
              hitSource = null;

              status.textContent = 'Table found! Walk around to view Ghost.';
              setTimeout(() => { status.style.display = 'none'; }, 2500);
            }
            break;
          }
        }
        if (!foundTable) {
          reticle.visible = false;
          stableFrames = 0;
        }
      } else if (placed && worldAnchor && frame.trackedAnchors && frame.trackedAnchors.has(worldAnchor)) {
        const anchorPose = frame.getPose(worldAnchor.anchorSpace, refSpace);
        if (anchorPose) {
          const ap = anchorPose.transform.position;
          ghost.position.set(ap.x, ap.y, ap.z);
        }
      }
    }

    renderer.render(scene, camera);
  });
};
</script>
</body>
</html>
